apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-server
spec:
  # Начинаем с одного Pod; масштабирование до 3 сделаем отдельным экспериментом.
  replicas: 1
  selector:
    matchLabels:
      app: fitness-server
  template:
    metadata:
      labels:
        app: fitness-server
    spec:
      containers:
        - name: server
          image: 7lab-server:mode
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp
              containerPort: 5000
              protocol: TCP
          env:
            - name: DB_HOST
              value: db-primary
            - name: DB_PORT
              value: "5432"
            - name: REPLICA_DB_HOST
              value: db-replica
            - name: REPLICA_DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: fitness-db-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fitness-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fitness-db-secret
                  key: POSTGRES_PASSWORD
            - name: BOOKING_DELAY_SECONDS
              value: "4"
            - name: TZ
              value: Europe/Vilnius
          # Сервер при старте ожидает обе БД, поэтому даём ему время на запуск.
          startupProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fitness-server
spec:
  type: ClusterIP
  selector:
    app: fitness-server
  ports:
    - name: tcp
      port: 5000
      targetPort: 5000
      protocol: TCP
