name: fitness-lab4

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_db}
      POSTGRES_USER: ${POSTGRES_USER:-fitness_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_pass}
      TZ: Europe/Vilnius
    volumes:
      - fitness_lab4_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - fitness-net

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: Server
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fitness_db}
      DB_USER: ${POSTGRES_USER:-fitness_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fitness_pass}
      BOOKING_DELAY_SECONDS: ${BOOKING_DELAY_SECONDS:-4}
      TZ: Europe/Vilnius
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - fitness-net

  # Автоматические интеграционные проверки ЛР №4: docker compose run --build --rm integration-test
  integration-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: Tests
    environment:
      SERVER_HOST: server
      SERVER_PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fitness_db}
      DB_USER: ${POSTGRES_USER:-fitness_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fitness_pass}
      TZ: Europe/Vilnius
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - fitness-net

networks:
  fitness-net:
    driver: bridge

volumes:
  fitness_lab4_pgdata:
